spring.application.name=pos2-restaurant-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos2_restaurant?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.pos2.restaurant=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

pos2.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
pos2.jwt.secret=${JWT_SECRET:pos2-development-secret-change-me-before-production}
pos2.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
