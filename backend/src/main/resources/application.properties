spring.application.name=pos2-restaurant-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos2_restaurant?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.pos2.restaurant=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

pos2.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
